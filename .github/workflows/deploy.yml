name: Publish Seasonal Weather

on:
  push:
    branches: [main]
    paths:
      - 'seasonal-weather-site.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare website from the uploaded ZIP
        run: |
          mkdir -p _site
          unzip -q seasonal-weather-site.zip -d _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/downloads/Seasonal_Weather_Widget_Kit.zip
          test -f _site/assets/backgrounds/fall_sunny_day.jpg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
